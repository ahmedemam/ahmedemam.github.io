---
layout: default
---

<main class="content" id="main">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="/">Home</a>
    <span>/</span>
    <span>{{ page.title }}</span>
  </nav>

  <article class="page">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.show_reading_time != false %}
    <p class="page-meta">
      {% include reading-time.html %}
    </p>
    {% endif %}
    {{ content }}
  </article>
</main>
